openapi: "3.1.0"
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: "1.0.0"
  description: Sakani Dz - Real Estate & Tourism Platform API
servers:
  - url: /api
    description: Base API path

tags:
  - name: health
    description: Health check
  - name: auth
    description: Authentication
  - name: clients
    description: Client profile & account
  - name: vendors
    description: Vendor registration & self-management
  - name: properties
    description: Property listings (apartments & villas)
  - name: sites
    description: Sites (property complexes)
  - name: tourist-spots
    description: Tourist spots
  - name: favorites
    description: Client favorites
  - name: history
    description: Client browsing history
  - name: reports
    description: Property reports / flagging
  - name: subscriptions
    description: Vendor subscriptions
  - name: admin
    description: Admin back-office
  - name: stats
    description: Statistics & dashboard

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # â”€â”€ Auth â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    AuthResponse:
      type: object
      required: [accessToken, refreshToken, role, userId]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        role:
          type: string
          enum: [client, vendor, admin]
        userId:
          type: integer
        name:
          type: ["string", "null"]

    # â”€â”€ Entities â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    Client:
      type: object
      required: [id, name, email, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        preferredWilaya:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    VendorSummary:
      type: object
      required: [id, firstName, lastName, phone]
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        email:
          type: ["string", "null"]
        isVerified:
          type: boolean

    Vendor:
      type: object
      required: [id, firstName, lastName, phone, email, status, allowedPropertyTypes, createdAt]
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        address:
          type: ["string", "null"]
        phone:
          type: string
        email:
          type: string
        code:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, active, renewal_required, blocked, rejected]
        allowedPropertyTypes:
          type: array
          items:
            type: string
        isVerified:
          type: boolean
        lastAccessAt:
          type: ["string", "null"]
          format: date-time
        blockedAt:
          type: ["string", "null"]
          format: date-time
        subscriptionExpiresAt:
          type: ["string", "null"]
          format: date-time
        totalViews:
          type: integer
        totalProperties:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Property:
      type: object
      required: [id, vendorId, type, price, wilaya, status, photos, equipment, createdAt]
      properties:
        id:
          type: integer
        vendorId:
          type: integer
        vendor:
          $ref: "#/components/schemas/VendorSummary"
        type:
          type: string
          enum: [apartment, villa]
        apartmentType:
          type: ["string", "null"]
          enum: [F1, F2, F3, F4, F5, null]
        description:
          type: ["string", "null"]
        equipment:
          type: array
          items:
            type: string
        price:
          type: number
        latitude:
          type: ["number", "null"]
        longitude:
          type: ["number", "null"]
        photos:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [available, rented]
        wilaya:
          type: string
        siteId:
          type: ["integer", "null"]
        views:
          type: integer
        isFeatured:
          type: boolean
        createdAt:
          type: string
          format: date-time

    Site:
      type: object
      required: [id, vendorId, name, wilaya, photos, createdAt]
      properties:
        id:
          type: integer
        vendorId:
          type: integer
        vendor:
          $ref: "#/components/schemas/VendorSummary"
        name:
          type: string
        description:
          type: ["string", "null"]
        latitude:
          type: ["number", "null"]
        longitude:
          type: ["number", "null"]
        photos:
          type: array
          items:
            type: string
        wilaya:
          type: string
        propertyCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    TouristSpot:
      type: object
      required: [id, name, wilaya, photos, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        wilaya:
          type: string
        description:
          type: ["string", "null"]
        latitude:
          type: ["number", "null"]
        longitude:
          type: ["number", "null"]
        photos:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time

    Subscription:
      type: object
      required: [id, vendorId, amount, propertyType, paidAt, expiresAt, status, createdAt]
      properties:
        id:
          type: integer
        vendorId:
          type: integer
        vendor:
          $ref: "#/components/schemas/VendorSummary"
        amount:
          type: number
        propertyType:
          type: string
          enum: [apartment, villa, site]
        paidAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [active, expired, cancelled]
        createdAt:
          type: string
          format: date-time

    Favorite:
      type: object
      required: [id, clientId, propertyId, createdAt]
      properties:
        id:
          type: integer
        clientId:
          type: integer
        propertyId:
          type: integer
        property:
          $ref: "#/components/schemas/Property"
        createdAt:
          type: string
          format: date-time

    HistoryEntry:
      type: object
      required: [id, clientId, entryType, viewedAt]
      properties:
        id:
          type: integer
        clientId:
          type: integer
        propertyId:
          type: ["integer", "null"]
        touristSpotId:
          type: ["integer", "null"]
        entryType:
          type: string
          enum: [property, tourist_spot]
        property:
          $ref: "#/components/schemas/Property"
        touristSpot:
          $ref: "#/components/schemas/TouristSpot"
        viewedAt:
          type: string
          format: date-time

    Report:
      type: object
      required: [id, propertyId, reason, status, createdAt]
      properties:
        id:
          type: integer
        propertyId:
          type: integer
        property:
          $ref: "#/components/schemas/Property"
        clientId:
          type: ["integer", "null"]
        reason:
          type: string
        details:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, resolved, dismissed]
        createdAt:
          type: string
          format: date-time

    PasswordResetRequest:
      type: object
      required: [id, vendorId, status, createdAt]
      properties:
        id:
          type: integer
        vendorId:
          type: integer
        vendor:
          $ref: "#/components/schemas/Vendor"
        newPassword:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        createdAt:
          type: string
          format: date-time

    # â”€â”€ Stats â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    AdminStats:
      type: object
      required: [totalVendors, activeVendors, pendingVendors, blockedVendors, renewalRequired, totalProperties, totalSites, totalTouristSpots, totalRevenue, newVendorsCount, period]
      properties:
        totalVendors:
          type: integer
        activeVendors:
          type: integer
        pendingVendors:
          type: integer
        blockedVendors:
          type: integer
        renewalRequired:
          type: integer
        totalProperties:
          type: integer
        totalSites:
          type: integer
        totalTouristSpots:
          type: integer
        totalRevenue:
          type: number
        newVendorsCount:
          type: integer
        period:
          type: string

    VendorStats:
      type: object
      required: [totalProperties, totalViews, totalSites, availableProperties, rentedProperties, viewsThisWeek, viewsThisMonth]
      properties:
        totalProperties:
          type: integer
        totalViews:
          type: integer
        totalSites:
          type: integer
        availableProperties:
          type: integer
        rentedProperties:
          type: integer
        viewsThisWeek:
          type: integer
        viewsThisMonth:
          type: integer

    DashboardStats:
      type: object
      required: [totalProperties, totalVillas, totalSites, totalTouristSpots, availableProperties, totalWilayas]
      properties:
        totalProperties:
          type: integer
        totalVillas:
          type: integer
        totalSites:
          type: integer
        totalTouristSpots:
          type: integer
        availableProperties:
          type: integer
        totalWilayas:
          type: integer

    VendorRanking:
      type: object
      required: [rank, totalViews, totalProperties, vendor]
      properties:
        rank:
          type: integer
        totalViews:
          type: integer
        totalProperties:
          type: integer
        vendor:
          $ref: "#/components/schemas/VendorSummary"

    WilayaStats:
      type: object
      required: [wilaya, propertyCount, siteCount, touristSpotCount]
      properties:
        wilaya:
          type: string
        propertyCount:
          type: integer
        siteCount:
          type: integer
        touristSpotCount:
          type: integer

    # â”€â”€ Pagination â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    Pagination:
      type: object
      required: [page, limit, total, totalPages]
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    # â”€â”€ List responses â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    PropertyListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Property"
        pagination:
          $ref: "#/components/schemas/Pagination"

    SiteListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Site"
        pagination:
          $ref: "#/components/schemas/Pagination"

    TouristSpotListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TouristSpot"
        pagination:
          $ref: "#/components/schemas/Pagination"

    VendorListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Vendor"
        pagination:
          $ref: "#/components/schemas/Pagination"

    SubscriptionListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Subscription"
        pagination:
          $ref: "#/components/schemas/Pagination"

    ReportListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Report"
        pagination:
          $ref: "#/components/schemas/Pagination"

    FavoriteListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Favorite"

    HistoryListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/HistoryEntry"

    VendorRankingListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/VendorRanking"

    WilayaStatsListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/WilayaStats"

    PasswordResetRequestListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/PasswordResetRequest"

    # â”€â”€ Input schemas (entity-shaped, NOT operation-shaped) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    ClientRegistrationInput:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 2
        email:
          type: string
        password:
          type: string
          minLength: 6
        phone:
          type: string
        preferredWilaya:
          type: string

    ClientLoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    VendorLoginInput:
      type: object
      required: [code, password]
      properties:
        code:
          type: string
        password:
          type: string

    AdminLoginInput:
      type: object
      required: [password]
      properties:
        password:
          type: string

    TokenRefreshInput:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    ForgotPasswordInput:
      type: object
      required: [code]
      properties:
        code:
          type: string

    AnonymousLoginInput:
      type: object
      required: [deviceId]
      properties:
        deviceId:
          type: string

    ClientUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 2
        phone:
          type: string
        preferredWilaya:
          type: string

    VendorRegistrationInput:
      type: object
      required: [firstName, lastName, phone, email, propertyType, wilaya]
      properties:
        firstName:
          type: string
          minLength: 2
        lastName:
          type: string
          minLength: 2
        address:
          type: string
        phone:
          type: string
        email:
          type: string

        propertyType:
          type: string
          enum: [apartment, villa, site]
        apartmentType:
          type: string
          enum: [F1, F2, F3, F4, F5]
        latitude:
          type: number
        longitude:
          type: number
        price:
          type: number
        photos:
          type: array
          items:
            type: string
        description:
          type: string
        wilaya:
          type: string

    VendorUpdate:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        address:
          type: string
        phone:
          type: string

    VendorPermissionsInput:
      type: object
      required: [allowedPropertyTypes]
      properties:
        allowedPropertyTypes:
          type: array
          items:
            type: string

    PropertyInput:
      type: object
      required: [type, price, wilaya, description]
      properties:
        type:
          type: string
          enum: [apartment, villa]
        apartmentType:
          type: string
          enum: [F1, F2, F3, F4, F5]
        description:
          type: string
        equipment:
          type: array
          items:
            type: string
        price:
          type: number
        latitude:
          type: number
        longitude:
          type: number
        photos:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [available, rented]
        wilaya:
          type: string
        siteId:
          type: integer

    PropertyUpdate:
      type: object
      properties:
        type:
          type: string
          enum: [apartment, villa]
        apartmentType:
          type: string
          enum: [F1, F2, F3, F4, F5]
        description:
          type: string
        equipment:
          type: array
          items:
            type: string
        price:
          type: number
        latitude:
          type: number
        longitude:
          type: number
        photos:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [available, rented]
        wilaya:
          type: string
        siteId:
          type: integer
        isFeatured:
          type: boolean

    SiteInput:
      type: object
      required: [name, wilaya]
      properties:
        name:
          type: string
          minLength: 2
        description:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        photos:
          type: array
          items:
            type: string
        wilaya:
          type: string

    SiteUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        photos:
          type: array
          items:
            type: string
        wilaya:
          type: string

    TouristSpotInput:
      type: object
      required: [name, wilaya]
      properties:
        name:
          type: string
          minLength: 2
        wilaya:
          type: string
        description:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        photos:
          type: array
          items:
            type: string

    TouristSpotUpdate:
      type: object
      properties:
        name:
          type: string
        wilaya:
          type: string
        description:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        photos:
          type: array
          items:
            type: string

    FavoriteInput:
      type: object
      required: [propertyId]
      properties:
        propertyId:
          type: integer

    HistoryInput:
      type: object
      required: [entryType]
      properties:
        propertyId:
          type: integer
        touristSpotId:
          type: integer
        entryType:
          type: string
          enum: [property, tourist_spot]

    ReportInput:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
        details:
          type: string

    SubscriptionInput:
      type: object
      required: [vendorId, propertyType, amount]
      properties:
        vendorId:
          type: integer
        propertyType:
          type: string
          enum: [apartment, villa, site]
        amount:
          type: number

paths:
  # â”€â”€ Health â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # â”€â”€ Auth â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  /auth/client/register:
    post:
      operationId: registerClient
      tags: [auth]
      summary: Register a new client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientRegistrationInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/client/login:
    post:
      operationId: loginClient
      tags: [auth]
      summary: Client login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientLoginInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/vendor/login:
    post:
      operationId: loginVendor
      tags: [auth]
      summary: Vendor login with code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorLoginInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/admin/login:
    post:
      operationId: loginAdmin
      tags: [auth]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [auth]
      summary: Refresh access token
      requestBody:
        required: true
